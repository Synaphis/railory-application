
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.outfit-generator]
verify_jwt = false

[functions.embed-and-search]
verify_jwt = false

[functions.prompt-parser]
verify_jwt = false

# New edge functions — JWT verified by Supabase gateway,
# then our _shared/auth.ts extracts the user from the token.
[functions.generate]
verify_jwt = true

[functions.save-outfit]
verify_jwt = true

[functions.try-on]
verify_jwt = true

[functions.profile]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

[functions.get-usage]
verify_jwt = true

# Stripe calls this directly — no user JWT present
[functions.stripe-webhook]
verify_jwt = false
